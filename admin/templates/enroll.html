{% extends "_auth.html" %}
{% block heading %}Set up two-factor{% endblock %}
{% block form %}
<p style="color:var(--text-muted);font-size:14px">
  Required for {{ user.role }} accounts. Scan this with Google Authenticator, 1Password, or any TOTP app.
</p>

<div class="qr" role="img" aria-label="QR code for two-factor setup">{{ qr|safe }}</div>

<details style="margin:var(--s4) 0">
  <summary style="cursor:pointer;font-size:13px;color:var(--text-muted)">Can't scan? Enter this key by hand</summary>
  <p class="secret" style="margin-top:var(--s3)">{{ secret }}</p>
</details>

<form method="post" novalidate>
  <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
  <div class="field">
    <label for="code">Confirm with the current 6-digit code</label>
    <input id="code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" required
           style="font-family:var(--mono);font-size:22px;letter-spacing:0.3em;text-align:center">
  </div>
  <button class="btn btn--primary btn--block" type="submit">Turn on two-factor</button>
</form>
{% endblock %}
