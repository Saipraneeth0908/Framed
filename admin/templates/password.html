{% extends "_auth.html" %}
{% block heading %}Change password{% endblock %}
{% block form %}
<form method="post" novalidate style="margin-top:var(--s4)">
  <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
  <div class="field">
    <label for="current">Current password</label>
    <input id="current" name="current" type="password" required autocomplete="current-password">
  </div>
  <div class="field">
    <label for="new">New password</label>
    <input id="new" name="new" type="password" required minlength="12" autocomplete="new-password">
    <span class="hint">At least 12 characters. Every other session signs out immediately.</span>
  </div>
  <button class="btn btn--primary btn--block" type="submit">Update password</button>
</form>
{% endblock %}
