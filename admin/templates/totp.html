{% extends "_auth.html" %}
{% block heading %}Two-factor code{% endblock %}
{% block form %}
<form method="post" novalidate style="margin-top:var(--s4)">
  <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
  <div class="field">
    <label for="code">6-digit code from your authenticator</label>
    <input id="code" name="code" type="text" inputmode="numeric" pattern="[0-9 ]{6,8}"
           autocomplete="one-time-code" required autofocus
           style="font-family:var(--mono);font-size:22px;letter-spacing:0.3em;text-align:center">
    <span class="hint">Codes rotate every 30 seconds. The previous one still works briefly.</span>
  </div>
  <button class="btn btn--primary btn--block" type="submit">Verify</button>
</form>
{% endblock %}
