{% extends "base.html" %}
{% block content %}
<section class="section">
  <div class="container">
    <div class="section__head">
      <h2>Shop</h2>
      <div class="muted">Search, filter, sort, and build your set.</div>
    </div>

    <div class="shopbar">
      <input id="q" class="input" placeholder="Search by brand, name, tags…"/>
      <select id="brand" class="select">
        <option value="">All brands</option>
      </select>
      <select id="color" class="select">
        <option value="">All colors</option>
        <option>orange</option><option>yellow</option><option>red</option><option>blue</option>
        <option>white</option><option>grey</option><option>green</option><option>black</option>
      </select>
      <select id="sort" class="select">
        <option value="featured">Featured</option>
        <option value="price_asc">Price: Low → High</option>
        <option value="price_desc">Price: High → Low</option>
        <option value="name_asc">Name: A → Z</option>
      </select>
      <button id="clear" class="btn btn--ghost">Clear</button>
    </div>

    <div class="grid" id="grid">
      {% for p in products %}
        <a class="card productCard"
           href="/product/{{ p.slug }}"
           data-brand="{{ p.brand }}"
           data-color="{{ p.color }}"
           data-price="{{ p.base_price }}"
           data-featured="{{ '1' if p.featured else '0' }}"
           data-name="{{ p.name|lower }}"
           data-tags="{{ (p.tags|join(' '))|lower }}">
          <div class="card__img" style="background-image:url('{{ p.images.poster }}')">
            <div class="card__overlay"></div>
            <div class="card__tag">{{ p.brand }}</div>
          </div>
          <div class="card__body">
            <div class="card__title">{{ p.name }}</div>
            <div class="muted small">{{ p.short_desc }}</div>
            <div class="card__meta">
              <span class="pill">{{ p.color }}</span>
              <span class="price">from ${{ p.base_price }}</span>
            </div>
          </div>
        </a>
      {% endfor %}
    </div>
  </div>
</section>
{% endblock %}

{% block scripts %}
<script src="/static/js/shop.js"></script>
{% endblock %}
