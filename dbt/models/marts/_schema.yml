version: 2

models:
  - name: mart_daily_kpis
    description: One row per calendar day. Zero days are present, not missing.
    columns:
      - name: day
        tests: [unique, not_null]
      - name: revenue_cents
        tests: [not_null]
      - name: orders
        tests: [not_null]

  - name: mart_funnel_daily
    columns:
      - name: sessions
        tests: [not_null]

  - name: mart_cart_abandonment
    columns:
      - name: outcome
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [converted, never_added, left_at_checkout, left_with_cart, active]

  - name: mart_product_performance
    columns:
      - name: product_id
        tests: [not_null]

  - name: mart_component_cover
    columns:
      - name: component_id
        tests: [unique, not_null]
      - name: available
        tests: [not_null]

  - name: mart_customer_cohorts
    columns:
      - name: cohort_month
        tests: [unique, not_null]

  - name: mart_traffic_daily
    columns:
      - name: day
        tests: [not_null]

  # ----- behaviour marts ------------------------------------------------- #

  - name: mart_visitor_sessions
    description: One row per visit, with engagement and outcome.
    columns:
      - name: session_key
        tests: [unique, not_null]
      - name: depth_band
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [bounce, glance, browse, deep]
      - name: outcome
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [bought, left_at_checkout, left_with_cart, saved_only,
                         viewed_only, landed_only]

  - name: mart_page_engagement
    columns:
      - name: path
        tests: [unique, not_null]
      - name: views
        tests: [not_null]

  - name: mart_product_journey
    columns:
      - name: product_id
        tests: [unique, not_null]
      - name: verdict
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [sold_unwatched, looked_never_bought, carted_never_bought,
                         converting, browsed_only, no_signal]

  - name: mart_seller_ranking
    columns:
      - name: product_id
        tests: [unique, not_null]
      - name: band
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [best_seller, worst_seller, never_sold, mid]

  - name: mart_abandoned_interest
    columns:
      - name: product_id
        tests: [unique, not_null]

  - name: mart_hourly_traffic
    description: Complete 7x24 grid. A heatmap with holes reads as broken instrumentation.
    columns:
      - name: sessions
        tests: [not_null]
      - name: day_name
        tests: [not_null]
