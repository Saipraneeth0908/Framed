global:
  resolve_timeout: 5m

route:
  receiver: slack
  group_by: [alertname, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: [severity="page"]
      receiver: phone
      group_wait: 0s
      repeat_interval: 30m
    - matchers: [severity="notify"]
      receiver: slack
    - matchers: [severity="digest"]
      receiver: email
      # A digest that arrives every five minutes is not a digest.
      group_wait: 12h
      group_interval: 24h
      repeat_interval: 24h

receivers:
  - name: phone
    webhook_configs:
      - url: ${PAGER_WEBHOOK_URL}
        send_resolved: true
  - name: slack
    slack_configs:
      - api_url: ${SLACK_WEBHOOK_URL}
        channel: "#fo-alerts"
        send_resolved: true
        title: "{{ .CommonLabels.alertname }}"
        text: "{{ range .Alerts }}{{ .Annotations.summary }}\n{{ .Annotations.runbook }}{{ end }}"
  - name: email
    email_configs:
      - to: ${DIGEST_EMAIL}
        from: alerts@framedobsessions.com
        smarthost: ${SMTP_HOST}
        send_resolved: false

inhibit_rules:
  # If Postgres is down, everything downstream is also down. Page once.
  - source_matchers: [alertname="PostgresUnreachable"]
    target_matchers: [severity=~"notify|digest"]
    equal: [env]
