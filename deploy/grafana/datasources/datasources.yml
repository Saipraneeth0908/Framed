apiVersion: 1

# Grafana is for infrastructure time-series and logs. Business dashboards live
# in Metabase, where the owner can build their own questions -- a SQL panel the
# owner cannot edit teaches them nothing.
datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      # One request_id traces a request across web, collector and worker.
      derivedFields:
        - name: request_id
          matcherRegex: '"request_id":"([^"]+)"'
          url: '/explore?left={"queries":[{"expr":"{job=~\"fo.*\"} |= \"$${__value.raw}\""}]}'
