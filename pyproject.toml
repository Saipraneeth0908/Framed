[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
# ponytail: copy strings in main.py run long; drop this and reflow them if 120 must hold
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  # Warehouse assertions. They skip on the ordinary run, because the marts are
  # built from the traffic that run generates; CI re-runs `-m marts` after
  # `dbt build`, which is the pass where they mean something.
  "marts: asserts against a built mart",
]
